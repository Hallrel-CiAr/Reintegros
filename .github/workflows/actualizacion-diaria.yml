name: Actualización automática de pasajes

on:
  schedule:
    # Corrida principal a las 14hs Argentina (UTC-3 = 17:00 UTC) + 3 reintentos
    # cada 30 min hasta las 15:30 ART, para cubrir fallas transitorias de los
    # sitios de origen (como una ruta sin resultados en una corrida puntual).
    # Cada corrida solo toca lo que sigue pendiente — la política es no
    # reintentar más allá de ese día: lo que quede sin cargar se avisa en la
    # página (banner de "pendientes de ayer") para carga manual obligatoria.
    - cron: '0 17 * * *'
    - cron: '30 17 * * *'
    - cron: '0 18 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # La corrida del 3/9 tardó 19:49 (al límite de 20) por lentitud real del
    # sitio tras varias búsquedas seguidas. Se sube más todavía mientras se
    # estabiliza el scraper nuevo de Aerolíneas Argentinas (agrega capturas y
    # diagnóstico extra); una vez que ande bien se puede bajar de nuevo.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar navegador (Chromium)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Ejecutar actualización
        working-directory: scripts
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
        run: node actualizar_automatico.js

      - name: Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scripts/debug
          if-no-files-found: ignore
          retention-days: 7
