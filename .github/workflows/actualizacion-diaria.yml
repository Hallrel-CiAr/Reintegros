name: Actualización automática de pasajes

on:
  schedule:
    # Corrida principal a las 5hs Argentina (UTC-3 = 8hs UTC) + 4 reintentos
    # cada 30 min hasta las 7hs ART (5 intentos en total por día — ver
    # MAX_INTENTOS en actualizar_automatico.js). Cada corrida es UN intento:
    # si una ruta no encuentra valor, el script anota el intento y recién al
    # 5º sin éxito la marca "agotada" — ahí, y solo ahí, la página habilita
    # la carga manual para esa fecha/ruta puntual.
    #
    # Los minutos NO son :00/:30 a propósito: se vio en corridas reales que
    # las ventanas en punto se atrasaban varias horas — GitHub documenta que
    # el tope de la hora y la media hora son los momentos de mayor carga de
    # todo el sistema de Actions. Correr en :03/:33 evita competir ahí.
    - cron: '3 8 * * *'
    - cron: '33 8 * * *'
    - cron: '3 9 * * *'
    - cron: '33 9 * * *'
    - cron: '3 10 * * *'
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # 40 min de margen: además de Aerolíneas Argentinas y Central de Pasajes
    # (que ya sacan capturas y diagnóstico en cada corrida), ahora corre
    # también el scraper nuevo de Ruta0 (modo "vehículo"), que puede ser más
    # lento hasta que se termine de ajustar con datos de corridas reales.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar navegador (Chromium)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Ejecutar actualización
        working-directory: scripts
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
        run: node actualizar_automatico.js

      - name: Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scripts/debug
          if-no-files-found: ignore
          retention-days: 7
